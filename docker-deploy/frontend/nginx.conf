server {
    listen 80;

    # Vue 前端静态文件
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;   # history 路由刷新不 404
    }

    # 后端 API 反向代理（backend 为 compose 服务名）
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;            # 批量检测耗时长
    }

    # 检测结果图 / 知识库图片静态资源
    location /pases/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # MJPEG 实时视频流：必须关缓冲，否则画面不出图
    location /api/video_feed {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }
}
