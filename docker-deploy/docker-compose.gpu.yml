# GPU 版 docker-compose - 适用于有 NVIDIA 显卡的机器
# 使用方法: docker compose -f docker-compose.gpu.yml up -d --build
services:
  mysql:
    image: mysql:8.0
    container_name: pases-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "584521"
      MYSQL_DATABASE: pases
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-time-zone='+08:00'
    ports:
      - "3307:3306"
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.gpu
    container_name: pases-backend
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./backend/weights:/app/pases/yolo1/weights
      - ./backend/model_config.json:/app/pases/yolo1/model_config.json
      - record_data:/app/pases/yolo1/record/img
      - upload_data:/app/pases/upload-demo/static/upload
      - knowledge_data:/app/pases/upload-demo/static/knowledge
    depends_on:
      - mysql
    # GPU 支持：Windows 需要 NVIDIA 驱动 + Docker Desktop GPU 支持 (WSL2)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: always

  frontend:
    build:
      context: /Users/mac/vscode/en/bingchonghaiguanlixitong
      dockerfile: /Users/mac/PycharmProjects/en/docker-deploy/frontend/Dockerfile
    container_name: pases-frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: always

volumes:
  mysql_data:
  record_data:
  upload_data:
  knowledge_data:
